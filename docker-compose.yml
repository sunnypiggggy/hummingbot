services:
  postgres:
    container_name: hummingbot-api-postgres
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env.control
    volumes:
      - ./api-files/postgres:/var/lib/postgresql/data
    networks:
      - hummingbot-control

  emqx:
    container_name: hummingbot-broker
    image: emqx:5
    restart: unless-stopped
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: node1.emqx.local
      EMQX_CLUSTER__DISCOVERY_STRATEGY: static
      EMQX_CLUSTER__STATIC__SEEDS: "[emqx@node1.emqx.local]"
      EMQX_LOADED_PLUGINS: "emqx_recon,emqx_retainer,emqx_management,emqx_dashboard"
    expose:
      - "1883"
      - "18083"
    ports:
      # API-managed Hummingbot instances use host networking. This is loopback-only.
      - "127.0.0.1:1883:1883"
    volumes:
      - ./api-files/emqx/data:/opt/emqx/data
      - ./api-files/emqx/log:/opt/emqx/log
    networks:
      - hummingbot-control

  hummingbot-api:
    container_name: hummingbot-api
    build:
      context: .
      dockerfile: Dockerfile.hummingbot-api
    image: hummingbot-api-orchestration:local
    restart: unless-stopped
    env_file:
      - .env.control
    environment:
      # DockerService talks to the host Docker socket, so bind sources must be host-visible paths.
      BOTS_PATH: /home/ubuntu/extra_drive/hummingbot/api-files
      # EDO is a non-tradable account dust asset with no Binance USDT market.
      # Excluding it prevents zero-valued account snapshots and repeated price warnings.
      BANNED_TOKENS: '["NAV","ARS","ETHW","ETHF","EDO"]'
    expose:
      - "8000"
    volumes:
      - ./api-files/bots:/hummingbot-api/bots
      - ./api-files/bots/credentials:/hummingbot-api/credentials
      - ./api-files/conf:/hummingbot-api/conf
      - ./api-files/logs:/hummingbot-api/logs
      - ./api-files:/home/ubuntu/extra_drive/hummingbot/api-files
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - emqx
    networks:
      - hummingbot-control

  binance-stocks-runtime:
    profiles:
      - stocks
    container_name: binance-stocks-runtime
    build:
      context: .
      dockerfile: Dockerfile.binance-stocks-runtime
    image: hummingbot/binance-stocks-runtime:local
    restart: unless-stopped
    env_file:
      - .env.control
    environment:
      BINANCE_STOCKS_CREDENTIALS_FILE: /run/secrets/binance_stocks_credentials
      BINANCE_STOCKS_ACCOUNT: stocks_managed
      BINANCE_STOCKS_DATABASE_NAME: hummingbot_stocks
      BINANCE_STOCKS_ORDER_PREFIX: x-HBSTK
      BINANCE_STOCKS_MAX_ORDER_USDC: "200"
      BINANCE_STOCKS_MAX_SYMBOL_USDC: "200"
      BINANCE_STOCKS_MAX_EXPOSURE_USDC: "2000"
      BINANCE_STOCKS_DAILY_LOSS_USDC: "200"
      BINANCE_STOCKS_PAPER_INITIAL_USDC: "2000"
      BINANCE_STOCKS_PAPER_FILL_LATENCY_MS: "1000"
      BINANCE_STOCKS_PAPER_MARKET_TIMEOUT_SECONDS: "5"
      BINANCE_STOCKS_PAPER_QUOTE_MAX_AGE_SECONDS: "10"
      BINANCE_STOCKS_PAPER_EQUITY_SNAPSHOT_SECONDS: "60"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./api-files/stocks-runtime/bots:/hummingbot-api/bots
      - ./api-files/stocks-runtime/logs:/hummingbot-api/logs
    secrets:
      - binance_stocks_credentials
    depends_on:
      - postgres
    networks:
      - hummingbot-control

  hummingbot-mcp:
    container_name: hummingbot-mcp
    image: hummingbot/hummingbot-mcp:latest
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - .env.control
    volumes:
      - ./mcp-files:/root/.hummingbot_mcp
    depends_on:
      - hummingbot-api
    networks:
      - hummingbot-control

  portfolio-grid-scheduler:
    profiles:
      - paper-grid
    container_name: portfolio-grid-scheduler
    build:
      context: .
      dockerfile: Dockerfile.portfolio-grid-scheduler
    restart: unless-stopped
    env_file:
      - .env.control
    environment:
      BOTS_PATH: /workspace/bots
      SCHEDULER_STATE_PATH: /workspace/state
      HUMMINGBOT_API_URL: http://hummingbot-api:8000
      PORTFOLIO_RUNTIME_IMAGE: hummingbot/hummingbot:latest
      PORTFOLIO_INSTANCE_NAME: walk-forward-portfolio-grid
      PORTFOLIO_INITIAL_QUOTE: "10000"
      PORTFOLIO_OPTIMIZATION_WORKERS: "4"
      PORTFOLIO_INTERVAL: 5m
    volumes:
      - ./api-files/bots:/workspace/bots
      - ./portfolio-grid-data:/workspace/state
      - ./results:/workspace/results
    depends_on:
      - hummingbot-api
    networks:
      - hummingbot-control

  portfolio-grid-fdusd-scheduler:
    profiles:
      - paper-grid
    container_name: portfolio-grid-fdusd-scheduler
    build:
      context: .
      dockerfile: Dockerfile.portfolio-grid-scheduler
    restart: unless-stopped
    env_file:
      - .env.control
    environment:
      BOTS_PATH: /workspace/bots
      SCHEDULER_STATE_PATH: /workspace/state
      HUMMINGBOT_API_URL: http://hummingbot-api:8000
      PORTFOLIO_RUNTIME_IMAGE: hummingbot/hummingbot:latest
      PORTFOLIO_INSTANCE_NAME: walk-forward-portfolio-grid-fdusd
      PORTFOLIO_CREDENTIALS_PROFILE: fdusd_paper
      PORTFOLIO_CONFIG_NAME: walk_forward_portfolio_grid_fdusd.yml
      PORTFOLIO_QUOTE_ASSET: FDUSD
      PORTFOLIO_PAIRS: BTC-FDUSD,ETH-FDUSD,BNB-FDUSD,SOL-FDUSD,XRP-FDUSD,DOGE-FDUSD,LINK-FDUSD
      PORTFOLIO_PAPER_BALANCES_JSON: '{"FDUSD":100000,"BTC":1,"ETH":20,"BNB":100,"SOL":100,"XRP":100000,"DOGE":1000000,"LINK":10000}'
      PORTFOLIO_MAKER_FEE_RATE: "0"
      PORTFOLIO_TAKER_FEE_RATE: "0.0002"
      PORTFOLIO_INITIAL_QUOTE: "10000"
      PORTFOLIO_OPTIMIZATION_WORKERS: "4"
      PORTFOLIO_INTERVAL: 5m
      PORTFOLIO_TRAIN_DAYS: "7"
      PORTFOLIO_VALIDATION_DAYS: "7"
      PORTFOLIO_MIN_VALIDATION_RETURN: "0"
      PORTFOLIO_MIN_VALIDATION_SCORE: "0"
      PORTFOLIO_MAX_VALIDATION_DRAWDOWN: "0.04"
      PORTFOLIO_MIN_VALIDATION_CYCLES: "10"
      PORTFOLIO_ADOPT_INSTANCE: walk-forward-portfolio-grid-fdusd-20260711-091929
      PORTFOLIO_ADOPT_CONFIG: walk_forward_portfolio_grid_fdusd_maker0.yml
    volumes:
      - ./api-files/bots:/workspace/bots
      - ./portfolio-grid-fdusd-data:/workspace/state
      - ./results:/workspace/results
    depends_on:
      - hummingbot-api
    networks:
      - hummingbot-control

  grid-live-fdusd-scheduler:
    profiles:
      - live-admin
    container_name: grid-live-fdusd-scheduler
    build:
      context: .
      dockerfile: Dockerfile.grid-live-fdusd-scheduler
    image: hummingbot/grid-live-fdusd-scheduler:local
    restart: unless-stopped
    env_file:
      - .env.control
    environment:
      # Notification and Hermes credentials are not available to event producers.
      TELEGRAM_TOKEN: ""
      ADMIN_USER_ID: ""
      BOTS_PATH: /workspace/bots
      GRID_LIVE_FDUSD_STATE_PATH: /workspace/state
      GRID_LIVE_MACRO_STATE_PATH: /workspace/macro/state.json
      GRID_LIVE_GATE_RECONCILE_SECONDS: "5"
      GRID_PAIR_PARAMETER_SCHEMA_V2_ENABLED: "${GRID_PAIR_PARAMETER_SCHEMA_V2_ENABLED:-true}"
      V22_WEEKLY_AUTO_UPDATE_ENABLED: "${V22_WEEKLY_AUTO_UPDATE_ENABLED:-true}"
      V22_WEEKLY_DEFAULT_APPROVAL_DELAY_SECONDS: "${V22_WEEKLY_DEFAULT_APPROVAL_DELAY_SECONDS:-43200}"
      V22_WEEKLY_GENERATION_LEAD_SECONDS: "${V22_WEEKLY_GENERATION_LEAD_SECONDS:-57600}"
      V22_WEEKLY_MINIMUM_RUNWAY_SECONDS: "${V22_WEEKLY_MINIMUM_RUNWAY_SECONDS:-86400}"
      V22_WEEKLY_AUTOMATION_INTERVAL_SECONDS: "60"
      V22_WEEKLY_XGB_THREADS: "2"
      ETHBTC_RELEASE_FAMILY_PATH: /workspace/releases
      V22_WEEKLY_WORK_PATH: /workspace/weekly
      V22_WEEKLY_CANDLE_PATH: /workspace/weekly/candles
      V22_RUNTIME_ROOT: /workspace/state/v22-runtime
      DCA_LIVE_STATE_PATH: /workspace/dca-state
      MODEL_EVIDENCE_RECEIPT_ROOT: /workspace/dca-state/telegram/evidence_receipts
      PARAMETER_EVIDENCE_RECEIPT_ROOT: /workspace/dca-state/telegram/evidence_receipts
      MODEL_APPROVAL_DECISION_ROOT: /workspace/weekly/decisions
      GRID_V22_AUTHORIZATION_PATH: /workspace/state/ethbtc_forced_exit_authorization.json
      TELEGRAM_NOTIFICATION_EVENTS_PATH: /workspace/state/telegram_events.jsonl
    volumes:
      - ./api-files/bots:/workspace/bots
      - ./grid-live-fdusd-data:/workspace/state
      - ./dca-macro-data:/workspace/macro:ro
      - ./dca-live-data:/workspace/dca-state:ro
      - ./release_packages/ethbtc-forced-exit:/workspace/releases
      - ./results/ethbtc_forced_exit_weekly:/workspace/weekly
    depends_on:
      - hummingbot-api
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; p='/workspace/state/macro_gate.json'; d=json.load(open(p)); assert time.time()-__import__('datetime').datetime.fromisoformat(d['generated_at']).timestamp()<180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - hummingbot-control

  grid-live-fdusd-manager:
    profiles:
      - live-admin
    build:
      context: .
      dockerfile: Dockerfile.grid-live-fdusd-scheduler
    image: hummingbot/grid-live-fdusd-scheduler:local
    env_file:
      - .env.control
    environment:
      HUMMINGBOT_API_URL: http://hummingbot-api:8000
      BOTS_PATH: /workspace/bots
    command: ["python", "/app/deploy_fdusd_live_grid.py", "--state-dir", "/workspace/state"]
    volumes:
      - ./api-files/bots:/workspace/bots
      - ./grid-live-fdusd-data:/workspace/state
    depends_on:
      - hummingbot-api
    networks:
      - hummingbot-control

  grid-live-guard:
    profiles:
      - live-admin
    container_name: grid-live-guard
    build:
      context: .
      dockerfile: Dockerfile.grid-live-guard
    image: hummingbot/grid-live-guard:local
    restart: unless-stopped
    env_file:
      - .env.control
    environment:
      TELEGRAM_TOKEN: ""
      ADMIN_USER_ID: ""
      HUMMINGBOT_API_URL: http://hummingbot-api:8000
      BOTS_PATH: /workspace/bots
      GRID_LIVE_STATE_PATH: /workspace/state
      GRID_LIVE_RESERVATIONS: /workspace/state/capital_reservations.json
      GRID_BINANCE_EMERGENCY_CREDENTIALS_FILE: /run/secrets/grid_binance_emergency_credentials
      GRID_DOCKER_SOCKET: /var/run/docker.sock
      GRID_XGBOOST_GATE_DISTRIBUTION_SECONDS: "30"
      GRID_LIVE_GUARD_INTERVAL: "${GRID_LIVE_GUARD_INTERVAL:-2}"
      GRID_RUNTIME_ERROR_NOTIFY_AFTER_SECONDS: "${GRID_RUNTIME_ERROR_NOTIFY_AFTER_SECONDS:-6}"
      # v22 is the sole production producer.  Keep the retired v21 producer
      # explicitly disabled so a missing shell-level variable cannot revive it.
      GRID_V21_IN_GUARD_ENABLED: "false"
      # Explicit operator interlock. Set true only when the reviewed OCI rollout
      # is approved; false remains fail-closed for ordinary BUY orders.
      GRID_V21_LIVE_AUTHORIZED: "${GRID_V21_LIVE_AUTHORIZED:-false}"
      GRID_V21_PACKAGE_PATH: /workspace/package
      GRID_V21_CANDLE_PATH: /workspace/v21-candles
      GRID_V21_SEED_CANDLE_PATH: /workspace/research-candles
      GRID_V22_IN_GUARD_ENABLED: "true"
      GRID_V22_EXECUTION_MODE: "live"
      GRID_V22_PACKAGE_PATH: /workspace/v22-family
      GRID_V22_CANDLE_PATH: /workspace/technical-candles
      GRID_V22_SEED_CANDLE_PATH: /workspace/research-candles
      GRID_V22_AUTHORIZATION_PATH: /workspace/state/ethbtc_forced_exit_authorization.json
      V22_RUNTIME_ROOT: /workspace/state/v22-runtime
      GRID_RISK_V22_WEEKLY_GATE_ENABLED: "${GRID_RISK_V22_WEEKLY_GATE_ENABLED:-true}"
      GRID_RISK_FOMC_GATE_ENABLED: "${GRID_RISK_FOMC_GATE_ENABLED:-true}"
      GRID_RISK_STRATEGY_LOSS_BREAKER_ENABLED: "${GRID_RISK_STRATEGY_LOSS_BREAKER_ENABLED:-true}"
      GRID_RISK_STRATEGY_DRAWDOWN_BREAKER_ENABLED: "${GRID_RISK_STRATEGY_DRAWDOWN_BREAKER_ENABLED:-true}"
      GRID_RISK_PORTFOLIO_LOSS_BREAKER_ENABLED: "${GRID_RISK_PORTFOLIO_LOSS_BREAKER_ENABLED:-true}"
      GRID_RISK_PORTFOLIO_DRAWDOWN_BREAKER_ENABLED: "${GRID_RISK_PORTFOLIO_DRAWDOWN_BREAKER_ENABLED:-true}"
      GRID_RISK_POSITION_PROTECTION_ENABLED: "${GRID_RISK_POSITION_PROTECTION_ENABLED:-true}"
      ACCOUNT_INVENTORY_LEDGER_PATH: /workspace/account-inventory
    volumes:
      - ./api-files/bots:/workspace/bots
      - ./grid-live-fdusd-data:/workspace/state
      - ./account-inventory-data:/workspace/account-inventory
      - ./results/backtests/xgboost_grid_long_risk_gate_v21_250d/shadow_package:/workspace/package:ro
      - ./release_packages/ethbtc-forced-exit:/workspace/v22-family:ro
      - ./results/ethbtc_forced_exit_weekly/candles:/workspace/research-candles:ro
      - grid-live-guard-technical-candles:/workspace/v21-candles
      - grid-live-guard-technical-candles:/workspace/technical-candles
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - grid_binance_emergency_credentials
    depends_on:
      - hummingbot-api
    healthcheck:
      test: ["CMD", "python", "-c", "import datetime,json,os,time; s=json.load(open('/workspace/state/guard_state.json')); o=json.load(open('/workspace/state/ethbtc_forced_exit_observation.json')); r='/workspace/state/v22-runtime/current.json'; assert s.get('v22_in_guard') is True and o.get('package_id')=='ethbtc-forced-exit'; assert set(o.get('pairs',{}))=={'BTC-FDUSD','ETH-FDUSD'}; assert time.time()-s.get('last_success_at',0)<90; assert time.time()-datetime.datetime.fromisoformat(o['generated_at'].replace('Z','+00:00')).timestamp()<150; assert not os.path.isfile(r) or json.load(open(r))['runtime_generation']==o.get('runtime_generation') or o.get('cutover_phase')=='WARM_ROLLBACK_USING_SIGNED_PREDECESSOR'; assert not s.get('v22_cutover_complete') or s.get('active_technical_producer')=='v22'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - hummingbot-control

  dca-live-guard:
    container_name: dca-live-guard
    build:
      context: .
      dockerfile: Dockerfile.dca-live-guard
    image: hummingbot/dca-live-guard:local
    restart: unless-stopped
    env_file:
      - .env.control
    environment:
      TELEGRAM_TOKEN: ""
      ADMIN_USER_ID: ""
      HUMMINGBOT_API_URL: http://hummingbot-api:8000
      BOTS_PATH: /workspace/bots
      DCA_LIVE_STATE_PATH: /workspace/state
      DCA_LIVE_GUARD_INTERVAL: "${DCA_LIVE_GUARD_INTERVAL:-2}"
      DCA_LIVE_FAIL_CLOSED_SECONDS: "${DCA_LIVE_FAIL_CLOSED_SECONDS:-60}"
      DCA_V22_GATE_PATH: /workspace/technical/xgboost_risk_gate.json
      DCA_V22_OBSERVATION_GATE_PATH: /workspace/technical/ethbtc_forced_exit_observation.json
      DCA_V22_MAX_AGE_SECONDS: "150"
      DCA_MACRO_STATE_PATH: /workspace/macro/state.json
      DCA_MACRO_STATE_MAX_AGE_SECONDS: "30"
      DCA_RISK_V22_WEEKLY_GATE_ENABLED: "${DCA_RISK_V22_WEEKLY_GATE_ENABLED:-true}"
      DCA_RISK_FOMC_GATE_ENABLED: "${DCA_RISK_FOMC_GATE_ENABLED:-true}"
      DCA_RISK_STRATEGY_LOSS_BREAKER_ENABLED: "${DCA_RISK_STRATEGY_LOSS_BREAKER_ENABLED:-true}"
      DCA_RISK_STRATEGY_DRAWDOWN_BREAKER_ENABLED: "${DCA_RISK_STRATEGY_DRAWDOWN_BREAKER_ENABLED:-true}"
      DCA_RISK_PORTFOLIO_LOSS_BREAKER_ENABLED: "${DCA_RISK_PORTFOLIO_LOSS_BREAKER_ENABLED:-true}"
      DCA_RISK_PORTFOLIO_DRAWDOWN_BREAKER_ENABLED: "${DCA_RISK_PORTFOLIO_DRAWDOWN_BREAKER_ENABLED:-true}"
      DCA_RISK_POSITION_PROTECTION_ENABLED: "${DCA_RISK_POSITION_PROTECTION_ENABLED:-true}"
      # Observation-first rollout interlock. Enable only after exit audits pass.
      DCA_RISK_AUTO_REENTRY_ENABLED: "${DCA_RISK_AUTO_REENTRY_ENABLED:-true}"
      DCA_STRATEGY_DRAWDOWN_LIMIT_PCT: "${DCA_STRATEGY_DRAWDOWN_LIMIT_PCT:-0.08}"
      DCA_PORTFOLIO_DRAWDOWN_LIMIT_PCT: "${DCA_PORTFOLIO_DRAWDOWN_LIMIT_PCT:-0.08}"
      DCA_BINANCE_EMERGENCY_CREDENTIALS_FILE: /run/secrets/dca_binance_emergency_credentials
      DCA_DOCKER_SOCKET: /var/run/docker.sock
      ACCOUNT_INVENTORY_LEDGER_PATH: /workspace/account-inventory
      GRID_ACCOUNT_INVENTORY_STATE_PATH: /workspace/grid/guard_state.json
      GRID_ACCOUNT_INVENTORY_RESERVATIONS_PATH: /workspace/grid/capital_reservations.json
      ACCOUNT_INVENTORY_UNATTRIBUTED_AUTO_LIQUIDATE_ENABLED: "true"
      ACCOUNT_INVENTORY_CONFIRMATION_CYCLES: "3"
      ACCOUNT_INVENTORY_CONFIRMATION_SECONDS: "30"
      ACCOUNT_INVENTORY_BOOTSTRAP_BTC_CAP: "0.001554857672861421803102676728"
      ACCOUNT_INVENTORY_BOOTSTRAP_ETH_CAP: "0.00227157909293506300096269939"
    volumes:
      - ./api-files/bots:/workspace/bots:ro
      - ./dca-live-data:/workspace/state
      - ./grid-live-fdusd-data:/workspace/technical:ro
      - ./grid-live-fdusd-data:/workspace/grid:ro
      - ./account-inventory-data:/workspace/account-inventory
      - ./dca-macro-data:/workspace/macro:ro
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - dca_binance_emergency_credentials
    depends_on:
      - hummingbot-api
    healthcheck:
      test: ["CMD", "python", "-c", "import datetime,json,os,time; s=json.load(open('/workspace/state/guard_state.json')); o=json.load(open('/workspace/technical/ethbtc_forced_exit_observation.json')); r='/workspace/technical/v22-runtime/current.json'; assert time.time()-s.get('last_success_at',0)<90; assert o.get('package_id')=='ethbtc-forced-exit' and set(o.get('pairs',{}))=={'BTC-FDUSD','ETH-FDUSD'}; assert time.time()-datetime.datetime.fromisoformat(o['generated_at'].replace('Z','+00:00')).timestamp()<150; assert not os.path.isfile(r) or json.load(open(r))['runtime_generation']==o.get('runtime_generation') or o.get('cutover_phase')=='WARM_ROLLBACK_USING_SIGNED_PREDECESSOR'; assert s.get('roc_buy_guard',{}).get('active') is None"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - hummingbot-control

  dca-live-report:
    container_name: dca-live-report
    build:
      context: .
      dockerfile: Dockerfile.dca-live-guard
    image: hummingbot/dca-live-guard:local
    restart: unless-stopped
    env_file:
      # Notification-only, non-secret settings. Do not mount .env.control:
      # the report sender must not receive API/Hermes credentials.
      - ./telegram-notify.env
    environment:
      BOTS_PATH: /workspace/bots
      DCA_LIVE_STATE_PATH: /workspace/state
      GRID_LIVE_STATE_PATH: /workspace/grid
      ETHBTC_RELEASE_FAMILY_PATH: /workspace/releases
      GRID_PARAMETER_EVIDENCE_ROOT: /workspace/grid-parameter-evidence
      ACCOUNT_INVENTORY_LEDGER_PATH: /workspace/account-inventory
      # Approval requests and their PNG jobs are picked up within one minute.
      # The four-hour profit slot remains controlled by its persisted schedule.
      DCA_LIVE_REPORT_INTERVAL: "60"
      TELEGRAM_NOTIFY_BOT_TOKEN_FILE: /run/secrets/telegram_notify_bot_token
      TELEGRAM_ALERT_V22_WEEKLY_BUY_GATE_ENABLED: "${TELEGRAM_ALERT_V22_WEEKLY_BUY_GATE_ENABLED:-true}"
      TELEGRAM_ALERT_FOMC_GATE_ENABLED: "${TELEGRAM_ALERT_FOMC_GATE_ENABLED:-true}"
      TELEGRAM_ALERT_STRATEGY_LOSS_BREAKER_ENABLED: "${TELEGRAM_ALERT_STRATEGY_LOSS_BREAKER_ENABLED:-true}"
      TELEGRAM_ALERT_STRATEGY_DRAWDOWN_BREAKER_ENABLED: "${TELEGRAM_ALERT_STRATEGY_DRAWDOWN_BREAKER_ENABLED:-true}"
      TELEGRAM_ALERT_PORTFOLIO_LOSS_BREAKER_ENABLED: "${TELEGRAM_ALERT_PORTFOLIO_LOSS_BREAKER_ENABLED:-true}"
      TELEGRAM_ALERT_PORTFOLIO_DRAWDOWN_BREAKER_ENABLED: "${TELEGRAM_ALERT_PORTFOLIO_DRAWDOWN_BREAKER_ENABLED:-true}"
      TELEGRAM_ALERT_POSITION_PROTECTION_ENABLED: "${TELEGRAM_ALERT_POSITION_PROTECTION_ENABLED:-true}"
      XGBOOST_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    command: ["python", "/app/dca_live_report.py"]
    volumes:
      - ./api-files/bots:/workspace/bots:ro
      - ./dca-live-data:/workspace/state
      - ./grid-live-fdusd-data:/workspace/grid:ro
      - ./release_packages/ethbtc-forced-exit:/workspace/releases:ro
      - ./release_packages/ethbtc-forced-exit/parameter_evidence/grid_btc_medium_eth_long_v1:/workspace/grid-parameter-evidence:ro
      - ./account-inventory-data:/workspace/account-inventory:ro
    secrets:
      - telegram_notify_bot_token
    healthcheck:
      test:
        - CMD
        - python
        - /app/dca_live_report.py
        - --healthcheck
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hummingbot-control

  dca-live-manager:
    profiles:
      - live-admin
    build:
      context: .
      dockerfile: Dockerfile.dca-live-guard
    image: hummingbot/dca-live-guard:local
    env_file:
      - .env.control
    environment:
      HUMMINGBOT_API_URL: http://hummingbot-api:8000
      BOTS_PATH: /workspace/bots
      DCA_LIVE_STATE_PATH: /workspace/state
    command: ["python", "/app/deploy_dca_live.py"]
    volumes:
      - ./api-files/bots:/workspace/bots
      - ./dca-live-data:/workspace/state
    depends_on:
      - hummingbot-api
    networks:
      - hummingbot-control

  sunnypiggy-trade-bot:
    container_name: sunnypiggy-trade-bot
    build:
      context: .
      dockerfile: Dockerfile.trading-management-bot
    image: hummingbot/trading-management-bot:local
    restart: unless-stopped
    profiles:
      - telegram
    env_file:
      - .env.control
    environment:
      TELEGRAM_MANAGEMENT_BOT_TOKEN_FILE: /run/secrets/telegram_management_bot_token
      TRADING_MANAGEMENT_STATE_DIR: /state
      TRADING_MANAGEMENT_MUTATIONS_ENABLED: "${TRADING_MANAGEMENT_MUTATIONS_ENABLED:-false}"
      STOCKS_PAPER_TELEGRAM_TRADING_ENABLED: "${STOCKS_PAPER_TELEGRAM_TRADING_ENABLED:-true}"
      HUMMINGBOT_API_URL: http://hummingbot-api:8000
      STOCKS_API_URL: http://binance-stocks-runtime:8000
      GRID_GUARD_CONTRACT_PATH: /contracts/grid_guard_state.json
      DCA_GUARD_CONTRACT_PATH: /contracts/dca_guard_state.json
      INVENTORY_CONTRACT_PATH: /contracts/account_inventory_status.json
      TRADING_STATUS_PATH: /reports/trading_status.json
      PROFIT_SNAPSHOT_DB_PATH: /reports/telegram_outbox.sqlite
      OPERATIONS_REPORT_MAX_AGE_SECONDS: "300"
      MODEL_APPROVAL_REQUEST_ROOT: /approvals/weekly
      MODEL_APPROVAL_EVIDENCE_ROOT: /approvals/evidence
      MODEL_APPROVAL_DECISION_ROOT: /approvals/decisions
    volumes:
      - ./telegram-management-data:/state
      - ./grid-live-fdusd-data/guard_state.json:/contracts/grid_guard_state.json:ro
      - ./dca-live-data/guard_state.json:/contracts/dca_guard_state.json:ro
      - ./account-inventory-data/account_inventory_status.json:/contracts/account_inventory_status.json:ro
      - ./results/ethbtc_forced_exit_weekly/approval_public:/approvals/weekly:ro
      - ./dca-live-data/telegram:/approvals/evidence:ro
      - ./dca-live-data/telegram:/reports:ro
      - ./results/ethbtc_forced_exit_weekly/decisions:/approvals/decisions
    secrets:
      - telegram_management_bot_token
    depends_on:
      - hummingbot-api
    networks:
      - hummingbot-control

volumes:
  grid-live-guard-technical-candles:
    name: grid-live-guard-technical-candles

networks:
  hummingbot-control:
    name: hummingbot-control

secrets:
  binance_stocks_credentials:
    file: "${BINANCE_STOCKS_CREDENTIALS_PATH:-./config/binance_stocks_credentials.paper.json}"
  dca_binance_emergency_credentials:
    file: "${DCA_BINANCE_EMERGENCY_CREDENTIALS_PATH:-/home/ubuntu/secrets/dca_binance_emergency_credentials.json}"
  grid_binance_emergency_credentials:
    file: "${GRID_BINANCE_EMERGENCY_CREDENTIALS_PATH:-/home/ubuntu/secrets/grid_binance_emergency_credentials.json}"
  telegram_notify_bot_token:
    file: "${TELEGRAM_NOTIFY_BOT_TOKEN_PATH:-/home/ubuntu/secrets/telegram_notify_bot_token}"
  telegram_management_bot_token:
    file: "${TELEGRAM_MANAGEMENT_BOT_TOKEN_PATH:-/home/ubuntu/secrets/sunnypiggy_trade_bot_token}"
